name: Validate detection artifacts
on:
  push:
    branches: [main]
    paths: ['detections/**', 'coverage/**', 'tests/**', '.github/workflows/validate.yml']
  pull_request:
    paths: ['detections/**', 'coverage/**', 'tests/**', '.github/workflows/validate.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "PyYAML==6.0.2"
      - run: python -m unittest discover -s tests -v
